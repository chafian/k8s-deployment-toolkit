replicaCount: 1
resources:
  requests: {cpu: 100m, memory: 64Mi}
  limits: {cpu: 500m, memory: 128Mi}
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: app.staging.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: app-staging-tls
      hosts: [app.staging.example.com]
