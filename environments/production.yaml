replicaCount: 3
resources:
  requests: {cpu: 200m, memory: 128Mi}
  limits: {cpu: "1", memory: 256Mi}
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
pdb:
  enabled: true
  maxUnavailable: 1
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: app.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: app-production-tls
      hosts: [app.example.com]
